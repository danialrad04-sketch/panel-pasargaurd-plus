name: Build PasarGuard Android VPN APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-client/**'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'android-client/**'
  workflow_dispatch:
    inputs:
      panel_base_url:
        description: 'PasarGuard Panel Base URL (optional override)'
        required: false
        default: 'https://panel.example.com'
      app_name:
        description: 'Branded App Name (optional override)'
        required: false
        default: 'PasarGuard VPN'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fetch latest Xray-core AndroidLibXrayLite (libv2ray.aar)
        run: |
          mkdir -p app/libs
          if [ ! -f app/libs/libv2ray.aar ]; then
            AAR_URL=$(curl -sSL https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | grep -oE 'https://[^"]+libv2ray\.aar' | head -n 1)
            curl -sSL "$AAR_URL" -o app/libs/libv2ray.aar
          fi
          ls -lh app/libs/libv2ray.aar

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build Debug APKs (Universal + ABI Splits)
        env:
          PASARGUARD_BASE_URL: ${{ github.event.inputs.panel_base_url || vars.PASARGUARD_BASE_URL || 'https://panel.example.com' }}
          PASARGUARD_BILLING_URL: ${{ vars.PASARGUARD_BILLING_URL }}
          PASARGUARD_APP_NAME: ${{ github.event.inputs.app_name || vars.PASARGUARD_APP_NAME || 'PasarGuard VPN' }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Build Release APKs (Unsigned)
        env:
          PASARGUARD_BASE_URL: ${{ github.event.inputs.panel_base_url || vars.PASARGUARD_BASE_URL || 'https://panel.example.com' }}
          PASARGUARD_BILLING_URL: ${{ vars.PASARGUARD_BILLING_URL }}
          PASARGUARD_APP_NAME: ${{ github.event.inputs.app_name || vars.PASARGUARD_APP_NAME || 'PasarGuard VPN' }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PasarGuardVPN-debug-apks
          path: android-client/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PasarGuardVPN-release-apks
          path: android-client/app/build/outputs/apk/release/*.apk
          retention-days: 30
