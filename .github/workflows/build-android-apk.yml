name: Upload verified Donino VPN 1.8.1 assets
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: '45467707490'
          github-token: ${{ github.token }}
          pattern: DoninoVpn-release-*
          merge-multiple: true
          path: release-assets
      - name: Verify and upload the three signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -c <<'CHECKSUMS'
          3b533026bb53917c5e186fe140ac9bd26d4997a1c5125a1824dc0c69d6a02fc2  app-arm64-v8a-release.apk
          8dfe63e50d2acc7622d40f75179f74a3994d7845c5c088ca3cceeb906fe8a4f7  app-armeabi-v7a-release.apk
          6508392ffff8e730da2d8dbe2d10b94218576401d7e13a8b5205fd5d49523dff  app-x86_64-release.apk
          CHECKSUMS
          cat >pasarguard-android.json <<'MANIFEST'
          {
            "latest_version": "1.8.1",
            "latest_version_code": 14,
            "package_name": "com.pasarguard.vpn",
            "visible": true,
            "assets": [
              {
                "abi": "arm64-v8a",
                "download_url": "https://github.com/danialrad04-sketch/panel-pasargaurd-plus/releases/download/android-v1.8.1/app-arm64-v8a-release.apk",
                "sha256": "3b533026bb53917c5e186fe140ac9bd26d4997a1c5125a1824dc0c69d6a02fc2"
              },
              {
                "abi": "armeabi-v7a",
                "download_url": "https://github.com/danialrad04-sketch/panel-pasargaurd-plus/releases/download/android-v1.8.1/app-armeabi-v7a-release.apk",
                "sha256": "8dfe63e50d2acc7622d40f75179f74a3994d7845c5c088ca3cceeb906fe8a4f7"
              },
              {
                "abi": "x86_64",
                "download_url": "https://github.com/danialrad04-sketch/panel-pasargaurd-plus/releases/download/android-v1.8.1/app-x86_64-release.apk",
                "sha256": "6508392ffff8e730da2d8dbe2d10b94218576401d7e13a8b5205fd5d49523dff"
              }
            ],
            "changelog": "تم و چیدمان تأییدشدهٔ ۱٫۵٫۰ برای Donino VPN بازگشته است."
          }
          MANIFEST
          test "$(gh release view android-v1.8.1 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          for file in app-*-release.apk pasarguard-android.json; do
            if gh release view android-v1.8.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              echo "Attachment already uploaded: $file"
            else
              gh release upload android-v1.8.1 "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
