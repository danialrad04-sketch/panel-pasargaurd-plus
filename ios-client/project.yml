name: PasarGuard
options:
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    APP_BUNDLE_ID: com.pasarguard.vpn.ios
    APP_GROUP_ID: group.com.pasarguard.vpn.ios
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PasarGuard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: PasarGuard VPN
        AppGroupIdentifier: $(APP_GROUP_ID)
        PacketTunnelIdentifier: $(APP_BUNDLE_ID).PacketTunnel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Configuration/App.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
    dependencies:
      - target: PacketTunnel
      - sdk: NetworkExtension.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
      - path: Dependencies/Geo
        buildPhase: resources
    info:
      path: Configuration/Tunnel-Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Configuration/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: ["$(APP_GROUP_ID)"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).PacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Tunnel/TunnelSocket.h
    dependencies:
      - framework: Dependencies/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
  PasarGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PasarGuard
schemes:
  PasarGuard:
    build:
      targets:
        PasarGuard: all
    test:
      targets: [PasarGuardTests]
