services:
  caddy:
    image: caddy:2.10-alpine
    environment:
      BILLING_HOST: ${BILLING_HOST:?required}
      ACME_EMAIL: ${ACME_EMAIL:?required}
      NO_PROXY: billing,localhost,127.0.0.1
      no_proxy: billing,localhost,127.0.0.1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - billing-tls:/data
    depends_on:
      billing:
        condition: service_healthy
    restart: unless-stopped

volumes:
  billing-tls:
