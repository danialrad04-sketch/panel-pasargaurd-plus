services:
  node:
    build:
      context: .
      dockerfile: Dockerfile.plus
    image: pasarguard-plus-node:paqet
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    env_file: .env
    environment:
      PG_NODE_PAQET_ENABLED: 'true'
    volumes:
      - type: bind
        source: ${PG_NODE_DATA_DIR:-/var/lib/pg-node}
        target: /var/lib/pg-node
