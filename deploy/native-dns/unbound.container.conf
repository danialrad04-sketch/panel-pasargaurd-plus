server:
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow
    username: unbound
    directory: /var/lib/unbound
    auto-trust-anchor-file: /var/lib/unbound/root.key
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    log-queries: no
    log-replies: no
    verbosity: 0
    msg-cache-size: 16m
    rrset-cache-size: 32m
